name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: miniharness_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MINIHARNESS_DB_HOST: 127.0.0.1
      MINIHARNESS_DB_PORT: 3306
      MINIHARNESS_DB_USER: root
      MINIHARNESS_DB_PASSWORD: ci-root-password
      MINIHARNESS_DB_NAME: miniharness_test
      MINIHARNESS_MODEL_PROVIDER: ollama

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests -v

      - name: Run Mock evaluation
        run: >-
          python scripts/run_evaluation.py
          --mode mock
          --output data/results/ci_mock.json

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mock-evaluation
          path: |
            data/results/ci_mock.json
            data/results/ci_mock.csv
          if-no-files-found: error
